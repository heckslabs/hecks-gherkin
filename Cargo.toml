[package]
name = "hecks-gherkin"
version = "0.1.0"
edition = "2021"
description = "Projects plain-sentence Hecks domains into Ruby-form bluebook text."
license = "MIT"

[lib]
name = "hecks_gherkin"
path = "src/lib.rs"

[[bin]]
name = "hecks-gherkin"
path = "src/main.rs"

[dependencies]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
